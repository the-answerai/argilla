services:
  # Main Argilla API service using Docker image
  - type: web
    name: argilla-api
    runtime: docker
    repo: https://github.com/the-answerai/argilla.git
    branch: feature/nodejs-answeraiintegration
    dockerfilePath: ./Dockerfile
    plan: standard
    envVars:
      - key: ARGILLA_HOME_PATH
        value: /var/lib/argilla
      - key: USERNAME
        value: argilla
      - key: PASSWORD
        generateValue: true
      - key: API_KEY
        generateValue: true
      - key: WORKSPACE
        value: default 