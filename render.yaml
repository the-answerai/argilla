services:
  # Main Argilla API service using Docker image
  - type: web
    name: argilla-api
    runtime: docker
    repo: https://github.com/the-answerai/argilla.git
    branch: feature/nodejs-answeraiintegration
    dockerfilePath: ./Dockerfile
    plan: standard
    envVars:
      - key: ARGILLA_HOME_PATH
        value: /var/lib/argilla
      - key: ARGILLA_DATABASE_URL
        fromService:
          type: pserv
          name: postgres-db
          property: connectionString
      - key: ARGILLA_REDIS_URL
        fromService:
          type: redis
          name: redis
          property: connectionString
      - key: USERNAME
        value: argilla
      - key: PASSWORD
        generateValue: true
      - key: API_KEY
        generateValue: true
      - key: WORKSPACE
        value: default

  # PostgreSQL Database
  - type: pserv
    name: postgres-db
    runtime: docker
    repo: https://github.com/render-examples/postgres
    plan: standard
    envVars:
      - key: POSTGRES_USER
        value: postgres
      - key: POSTGRES_PASSWORD
        generateValue: true
      - key: POSTGRES_DB
        value: argilla

  # Redis service
  - type: redis
    name: redis
    ipAllowList:
      - source: 0.0.0.0/0
        description: everywhere 